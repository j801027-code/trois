<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trois - Official Space</title>
    <!-- QR 코드 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #cbbba8;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(90, 75, 60, 0.2) 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            width: 100%;
            max-width: 1100px;
            z-index: 10;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .cta-top {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.18);
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }

        .cta-top:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        main {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: linear-gradient(135deg, #a67c52 0%, #8c6239 50%, #6e4a27 100%);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .profile-hero {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .photo-upload-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.15);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .photo-upload-wrapper:hover {
            transform: scale(1.03);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 0.75rem;
            text-align: center;
            padding: 4px 0;
        }

        #file-input {
            display: none;
        }

        .profile-info {
            flex: 1;
            min-width: 280px;
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.6;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .link-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-link {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-link:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
        }

        .qr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .qr-card h3 {
            font-size: 1.05rem;
            margin-bottom: 15px;
        }

        .qr-box {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .qr-desc {
            margin-top: 12px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .board-card h3 {
            font-size: 1.15rem;
            margin-bottom: 15px;
        }

        .board-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .board-input, .board-textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .board-input::placeholder, .board-textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .board-textarea {
            resize: none;
            height: 70px;
        }

        .board-submit {
            background: #f7f5f0;
            color: #1a1a1a;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .board-submit:hover {
            background: #ffffff;
        }

        .board-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .board-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .board-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-weight: 600;
            color: #f7f5f0;
        }

        .board-item-time {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .floating-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .circle-btn {
            width: 54px;
            height: 54px;
            background-color: #f7f5f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .circle-btn:hover {
            transform: translateY(-3px);
        }

        .circle-btn svg {
            width: 22px;
            height: 22px;
            stroke: #1a1a1a;
            stroke-width: 2;
            fill: none;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }
            .nav-links {
                display: none;
            }
            .bottom-grid {
                grid-template-columns: 1fr;
            }
            .profile-hero {
                flex-direction: column;
                text-align: center;
            }
            .link-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Trois^</a>
        <ul class="nav-links">
            <li><a href="https://blog.naver.com/j801027" target="_blank">네이버 블로그</a></li>
            <li><a href="https://www.blogger.com/blog/posts/9046489405702915644?hl=ko&tab=jj" target="_blank">구글 블로그</a></li>
            <li><a href="https://github.com/j801027-code" target="_blank">GitHub</a></li>
        </ul>
        <a href="https://j801027-code.github.io/trois/" class="cta-top">홈페이지 바로가기</a>
    </header>

    <main>
        <div class="card profile-hero">
            <div class="photo-upload-wrapper" onclick="document.getElementById('file-input').click();" title="클릭하여 프로필 사진 등록/변경">
                <img id="profile-img-preview" class="profile-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='1.5'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'></path><circle cx='12' cy='7' r='4'></circle></svg>" alt="프로필 사진">
                <div class="photo-overlay">사진 등록</div>
            </div>
            <input type="file" id="file-input" accept="image/*" onchange="uploadPhoto(event)">

            <div class="profile-info">
                <h1 class="hero-title">Trois Official Hub</h1>
                <p class="hero-desc">
                    안녕하세요! Trois의 공간입니다. 일상, 여행, 개발 기록을 나누는 공식 멀티 블로그 플랫폼입니다. 아래 링크를 통해 원하시는 블로그로 이동해 보세요.
                </p>
                <div class="link-group">
                    <!-- 네이버 블로그 링크 -->
                    <a href="https://blog.naver.com/j801027" target="_blank" class="btn-link">
                        💚 네이버 블로그
                    </a>
                    <!-- 구글 블로거 링크 -->
                    <a href="https://www.blogger.com/blog/posts/9046489405702915644?hl=ko&tab=jj" target="_blank" class="btn-link">
                        🧡 구글 블로그
                    </a>
                    <!-- GitHub 링크 -->
                    <a href="https://github.com/j801027-code" target="_blank" class="btn-link">
                        🌐 GitHub 프로필
                    </a>
                </div>
            </div>
        </div>

        <div class="bottom-grid">
            <div class="card qr-card">
                <h3>홈페이지 바로가기</h3>
                <div class="qr-box" id="qrcode"></div>
                <div class="qr-desc">스마트폰으로 스캔하여 접속하세요.</div>
            </div>

            <div class="card board-card">
                <h3>방명록 / 한줄 메모장</h3>
                <form class="board-form" onsubmit="addPost(event)">
                    <div class="input-row">
                        <input type="text" id="author" class="board-input" placeholder="작성자 이름" required>
                    </div>
                    <textarea id="message" class="board-textarea" placeholder="메시지를 남겨주세요..." required></textarea>
                    <button type="submit" class="board-submit">작성하기</button>
                </form>

                <div class="board-list" id="board-list"></div>
            </div>
        </div>
    </main>

    <div class="floating-buttons">
        <a href="https://blog.naver.com/j801027" target="_blank" class="circle-btn" title="네이버 블로그">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </a>
        <a href="https://j801027-code.github.io/trois/" class="circle-btn" title="홈으로 이동">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
        </a>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const pageUrl = window.location.href;
            new QRCode(document.getElementById("qrcode"), {
                text: pageUrl,
                width: 120,
                height: 120,
                colorDark : "#1a1a1a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            
            const savedImg = localStorage.getItem('trois_profile_img');
            if (savedImg) {
                document.getElementById('profile-img-preview').src = savedImg;
            }

            loadPosts();
        });

        function uploadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const result = e.target.result;
                    document.getElementById('profile-img-preview').src = result;
                    try {
                        localStorage.setItem('trois_profile_img', result);
                    } catch (err) {
                        console.log('이미지 용량이 커서 저장되지 않았습니다.');
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function addPost(event) {
            event.preventDefault();
            const author = document.getElementById('author').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!author || !message) return;

            const newPost = {
                author: author,
                message: message,
                time: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            let posts = JSON.parse(localStorage.getItem('trois_board_posts') || '[]');
            posts.unshift(newPost);
            localStorage.setItem('trois_board_posts', JSON.stringify(posts));

            document.getElementById('author').value = '';
            document.getElementById('message').value = '';

            loadPosts();
        }

        function loadPosts() {
            const boardList = document.getElementById('board-list');
            const posts = JSON.parse(localStorage.getItem('trois_board_posts') || '[]');

            if (posts.length === 0) {
                boardList.innerHTML = '<div class="board-item">첫 번째 방명록 남기기!</div>';
                return;
            }

            boardList.innerHTML = posts.map(post => `
                <div class="board-item">
                    <div class="board-item-header">
                        <span>${escapeHtml(post.author)}</span>
                        <span class="board-item-time">${post.time}</span>
                    </div>
                    <div>${escapeHtml(post.message)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
