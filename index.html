<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trois - Official Site</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 카드 컨테이너 */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.7);
        }

        /* 프로필 이미지/아바타 영역 */
        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin: 0 auto 20px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* 텍스트 스타일 */
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 16px;
            font-weight: 500;
        }

        p.desc {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 링크 버튼 목록 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: block;
            padding: 14px;
            background: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .link-btn:hover {
            background: #6366f1;
            border-color: #818cf8;
            transform: scale(1.02);
        }

        /* 푸터 */
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 프로필 아이콘 (이모지 변경 가능) -->
        <div class="avatar">🚀</div>

        <!-- 타이틀 및 설명 -->
        <h1>Trois World</h1>
        <div class="subtitle">Developer & Creator</div>
        <p class="desc">
            안녕하세요! 개인 프로젝트와 기록을 남기는 공식 공간입니다. 자유롭게 둘러보세요.
        </p>

        <!-- 연결 링크 버튼 -->
        <div class="links">
            <a href="https://github.com/j801027-code" target="_blank" class="link-btn">🐱 GitHub 프로필 방문하기</a>
            <a href="https://github.com/j801027-code/trois" target="_blank" class="link-btn">📂 저장소(Repository) 보기</a>
            <a href="mailto:your-email@example.com" class="link-btn">✉️ 이메일 보내기</a>
        </div>

        <footer>
            © Trois. All rights reserved.
        </footer>
    </div>

</body>
</html>
